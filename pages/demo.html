<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>revoice — voice-match demo</title>
<meta name="description" content="Score text against example author baselines (Mark Twain, Charles Darwin) with revoice's browser stylometrics — including an honest look at how reliable the measure actually is.">
<script src="https://cdn.jsdelivr.net/npm/bitwrench/dist/bitwrench.umd.min.js"></script>
<script src="site.js"></script>
<script src="stylometry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
/* Voice-match demo.
 *
 * Honesty rules this page follows, because the measure is weak enough that a
 * confident-looking UI would mislead:
 *   - samples are LABELLED by provenance; two of them are training data and say so
 *   - the winning voice is reported with its MARGIN over the runner-up, because a
 *     1-point win across four baselines is not a result
 *   - the measured reliability (AUC 0.64 / EER 0.40 under topic control) is stated
 *     on the page, not buried
 */

var VOICES = null, SAMPLES = null;

/* colour a 0-100 relative score the same way everywhere */
function scoreVariant(rel) {
  if (rel >= 95) return 'success';
  if (rel >= 80) return 'info';
  if (rel >= 65) return 'warning';
  return 'danger';
}

function marginNote(margin) {
  if (margin >= 15) return ['success', 'clear winner — ' + margin.toFixed(0) + ' points clear of the runner-up'];
  if (margin >= 8)  return ['info', 'modest lead — ' + margin.toFixed(0) + ' points over the runner-up'];
  if (margin >= 3)  return ['warning', 'narrow — only ' + margin.toFixed(1) + ' points separate the top two voices. Treat this as a coin flip with a lean.'];
  return ['danger', 'no real winner — the top two voices are within ' + margin.toFixed(1) + ' points. This measure cannot tell them apart.'];
}

/* ---- results panel: one stateful TACO, refreshed in place ---- */
var results = { data: null };

function resultsView(d) {
  if (!d) {
    return bw.makeAlert({
      content: 'Pick a sample above or paste your own text, then press “score it”.',
      variant: 'light'
    });
  }
  if (d.error) return bw.makeAlert({ content: d.error, variant: 'warning' });

  var top = d.rows[0], margin = d.rows[0].rel - d.rows[1].rel;
  var mv = marginNote(margin);

  return { t: 'div', c: [
    { t: 'div', a: { class: 'rv_cards' }, c: [
      bw.makeStatCard({ value: top.rel.toFixed(0), label: 'best match: ' + top.label,
                        suffix: ' / 100', variant: scoreVariant(top.rel) }),
      bw.makeStatCard({ value: margin.toFixed(1), label: 'margin over runner-up (' + d.rows[1].label + ')',
                        variant: mv[0] }),
      bw.makeStatCard({ value: d.words, label: 'words scored',
                        variant: d.words < 150 ? 'warning' : '' })
    ]},
    bw.makeAlert({ variant: mv[0], content: { t: 'span', c: [{ t: 'b', c: 'Reading this: ' }, mv[1]] } }),
    d.words < 150 ? bw.makeAlert({ variant: 'warning', content:
      'Under 150 words these scores are noisy — the components that carry the signal need more text to stabilise.' }) : '',
    scrollTable({
      data: d.rows,
      columns: [
        { key: 'label', label: 'voice · register' },
        { key: 'rel', label: 'match (100 ≈ corpus self-score)',
          render: function (v) {
            return bw.makeProgress({ value: Math.min(v, 115), max: 115,
                                     variant: scoreVariant(v), label: v.toFixed(0) });
          } },
        { key: 'delta', label: 'function words (Δ)' },
        { key: 'ngram', label: 'n-grams' },
        { key: 'rhythm', label: 'rhythm' },
        { key: 'punct', label: 'punctuation' }
      ],
      sortable: true, hover: true
    })
  ]};
}

function analyze(el) {
  var text = (bw.el('#txt') || {}).value || '';
  if (!VOICES) { results.data = { error: 'baselines still loading…' }; return bw.refresh(el); }
  if (text.trim().length < 40) { results.data = { error: 'Need a bit more text — a paragraph at minimum.' }; return bw.refresh(el); }

  var fp = fingerprint(text), rows = [];
  Object.keys(VOICES).forEach(function (v) {
    Object.keys(VOICES[v]).forEach(function (reg) {
      var r = score(fp, VOICES[v][reg]);
      rows.push({ label: v + ' · ' + reg, rel: r.rel,
                  delta: r.parts.delta.toFixed(2), ngram: r.parts.ngram.toFixed(2),
                  rhythm: r.parts.rhythm.toFixed(2), punct: r.parts.punct.toFixed(2) });
    });
  });
  rows.sort(function (a, b) { return b.rel - a.rel; });
  results.data = { rows: rows, words: fp.words };
  bw.refresh(el);
}

function sampleButtons(panel) {
  if (!SAMPLES) return bw.makeSpinner({ size: 'sm' });
  var variantFor = { corpus: 'outline_warning', heldout: 'outline_primary', foreign: 'outline_secondary' };
  return { t: 'div', c: [
    bw.makeButtonGroup({ size: 'sm', children: Object.keys(SAMPLES).map(function (k) {
      var s = SAMPLES[k];
      return bw.makeButton({ text: s.label, variant: variantFor[s.kind] || 'outline_primary',
        onclick: function () {
          bw.el('#txt').value = s.text;
          bw.el('#sample_note', bw.makeAlert({
            variant: s.kind === 'corpus' ? 'warning' : (s.kind === 'heldout' ? 'info' : 'secondary'),
            content: { t: 'span', c: [{ t: 'b', c: s.label + ' — ' }, s.note] } }));
          analyze(panel);
        } });
    }) }),
    { t: 'div', a: { id: 'sample_note' }, c: '' }
  ]};
}

bw.mount('#app', sitePage('demo.html', [
  { t: 'h1', c: 'Voice-match demo' },
  { t: 'p', c: 'Paste text; this page scores it against four baselines built from public-domain corpora — Mark Twain (fiction, essay) and Charles Darwin (memoir, science). Everything runs in your browser; nothing is uploaded.' },

  bw.makeAlert({ variant: 'info', content: { t: 'span', c: [
    { t: 'b', c: 'What this page is showing. ' },
    'Each voice has a baseline: the average of its corpus on function-word frequencies, character n-grams, sentence-length rhythm, and punctuation habits. Your text gets the same measurements, and the score is how close they land — normalised so that ',
    { t: 'b', c: '100 ≈ as close as the corpus is to itself' }, '. Above 100 just means “closer than a typical corpus document”, not “more Twain than Twain”.',
    { t: 'br' }, { t: 'br' },
    { t: 'b', c: 'The catch: these habits track register more than authorship. ' },
    'Sentence rhythm, punctuation and sub-word texture say more about how a passage is pitched than about who wrote it — so a first-person memoir by one author can land close to first-person fiction by another. Watch the margin, not just the winner.'
  ]}}),

  section('Try it', [
    { t: 'p', c: 'Two of these samples are training data and are labelled as such — the point is to watch the score fall when you switch to text the baselines have never seen.' },
    { t: 'div', a: { id: 'samples' }, c: '' },
    { t: 'div', a: { class: 'bw_bccl_card' }, c: { t: 'div', a: { class: 'bw_bccl_card_body' }, c: [
      bw.makeFormGroup({
        label: 'Text to score',
        help: '150+ words gives stable scores; below that the measure is mostly noise.',
        input: bw.makeTextarea({ id: 'txt', rows: 9,
          placeholder: 'Paste a few paragraphs, or pick a sample above…' })
      }),
      { t: 'div', a: { id: 'go' }, c: '' }
    ]}},
    { t: 'div', a: { id: 'results' }, c: '' }
  ]),

  section('How much should you trust this?', [
    { t: 'p', c: 'Honestly: less than the numbers above look. We measured it rather than guessed.' },
    { t: 'div', a: { class: 'rv_cards' }, c: [
      bw.makeStatCard({ value: '0.64', label: 'AUC, topic-controlled (0.5 = coin flip)', variant: 'warning' }),
      bw.makeStatCard({ value: '0.40', label: 'equal error rate (lower is better)', variant: 'warning' }),
      bw.makeStatCard({ value: '0.93', label: 'Cllr — 1.0 = “don’t know”', variant: 'danger' })
    ]},
    bw.makeAlert({ variant: 'warning', content: { t: 'span', c: [
      { t: 'b', c: 'The big caveat: much of the apparent skill is topic, not voice. ' },
      'When the reference corpus is allowed to contain other writing about the same subject, the score looks far better than it is. Control for that and roughly a fifth of the performance disappears. Two authors of the same era writing on the same subject can easily be confused, and short passages routinely are.'
    ]}}),
    { t: 'p', c: ['Full evidence, the survey of authorship-verification literature, and the plan to fix it: ',
      { t: 'a', a: { href: 'https://github.com/deftio/revoice/blob/main/docs/metrics.md' }, c: 'docs/metrics.md' },
      '. You can reproduce every number with ', { t: 'code', c: 'revoice bench' }, '.'] }
  ]),

  section('What the local tool adds', [
    { t: 'p', c: ['This page runs a four-component subset in JavaScript. The installed tool adds vocabulary similarity, register attribution, content-blend analysis, full corpus calibration, and ',
      { t: 'code', c: 'revoice bench' }, ' — the harness that produced the numbers above. See ',
      { t: 'a', a: { href: 'getting-started.html' }, c: 'getting started' }, '.'] }
  ])
]));

/* mount the interactive bits as stateful regions, then load data */
var panel = bw.mount('#results', { t: 'div', o: {
  state: results,
  render: function (el) { bw.DOM(el, resultsView(results.data)); }
}});

bw.DOM('#go', bw.makeButton({ text: 'score it', variant: 'primary',
                              onclick: function () { analyze(panel); } }));

Promise.all([
  fetch('demo/voices.json').then(function (r) { return r.json(); }),
  fetch('demo/samples.json').then(function (r) { return r.json(); })
]).then(function (v) {
  VOICES = v[0]; SAMPLES = v[1];
  bw.DOM('#samples', sampleButtons(panel));
}).catch(function () {
  bw.DOM('#samples', bw.makeAlert({ variant: 'danger',
    content: 'Could not load demo/voices.json — serve this page over http rather than file://.' }));
});
</script>
</body>
</html>
