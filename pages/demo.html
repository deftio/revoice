<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>revoice — voice-match demo</title>
<meta name="description" content="Paste any text and score it against example voices (Mark Twain, Charles Darwin) with revoice's stylometrics — entirely in your browser, nothing uploaded.">
<script src="https://cdn.jsdelivr.net/npm/bitwrench/dist/bitwrench.umd.min.js"></script>
<script src="site.js"></script>
<script src="stylometry.js"></script>
</head>
<body>
<div id="app"></div>
<script>
bw.loadStyles(THEME);
bw.injectCSS(bw.css({
  '.vbar': { height: '12px', borderRadius: '4px', background: '#4a6fa5',
             display: 'inline-block', verticalAlign: 'middle' }
}));

// ---- page ----
var SAMPLES = {
  'Twain-ish': "When I was well grown, at last, I was sold and taken away, and I never saw her again. She was broken-hearted, and so was I, and we cried; but she comforted me as well as she could, and said we were sent into this world for a wise and good purpose, and must do our duties without repining, take our life as we might find it, live it for the best good of others, and never mind about the results; they were not our affair. She said men who did like this would have a noble and beautiful reward by and by in another world, and although we animals would not go there, to do well and right without reward would give to our brief lives a worthiness and dignity which in itself would be a reward. One may see by this that she had a wise and thoughtful head, for all there was so much lightness and vanity in it.",
  'Darwin-ish': "When on board H.M.S. Beagle, I was much struck with certain facts in the distribution of the inhabitants of South America, and in the geological relations of the present to the past inhabitants of that continent. These facts seemed to me to throw some light on the origin of species — that mystery of mysteries, as it has been called by one of our greatest philosophers. On my return home, it occurred to me that something might perhaps be made out on this question by patiently accumulating and reflecting on all sorts of facts which could possibly have any bearing on it. After five years' work I allowed myself to speculate on the subject, and drew up some short notes; these I enlarged in the year following into a sketch of the conclusions which then seemed to me probable: from that period to the present day I have steadily pursued the same object.",
  'AI-flavored': "In today's fast-paced world, it's important to note that effective writing serves as a testament to clear thinking. Moreover, leveraging robust and scalable communication strategies ensures seamless alignment across stakeholders and unlocks the full potential of any organization. It's worth noting that comprehensive approaches to documentation play a crucial role in navigating the complexities of the modern workplace. Furthermore, by diving deep into best practices, teams can elevate their deliverables and streamline their workflows. Ultimately, this isn't just about writing — it's about empowering seamless collaboration across the ever-evolving landscape of knowledge work. In conclusion, robust communication remains a game-changer for organizations seeking to deliver value at scale."
};

var VOICES = null;

function bar(v){ return { t:'span', c:[
  { t:'span', a:{class:'vbar', style:bw.s({width: Math.max(v*2.2,2)+'px'})} },
  { t:'span', a:{style:bw.s({marginLeft:'0.5em', fontSize:'0.9em'})}, c:' '+v.toFixed(1) } ]}; }

function analyze(){
  var text = bw.el('#txt').value || '';
  if(text.trim().length < 40){ bw.el('#results', {t:'p', c:'(need a bit more text)'}); return; }
  if(!VOICES){ bw.el('#results', {t:'p', c:'loading baselines…'}); return; }
  var fp = fingerprint(text);
  var rows = [];
  Object.keys(VOICES).forEach(function(v){
    Object.keys(VOICES[v]).forEach(function(reg){
      rows.push({ label: v+' · '+reg, r: score(fp, VOICES[v][reg]) });
    });
  });
  rows.sort(function(a,b){ return b.r.rel - a.r.rel; });
  var best = rows[0];
  bw.el('#results', { t:'div', a:{class:'bw_card'}, c:[
    { t:'h3', c:['likely match: ',
      best.r.rel >= 75
        ? { t:'span', a:{class:'bw_badge bw_success'}, c: best.label }
        : { t:'span', a:{class:'bw_badge bw_warning'}, c:'none — below every voice’s corpus self-band' },
      ' ', { t:'span', a:{style:bw.s({opacity:'0.7', fontSize:'0.85em'})},
            c:'('+fp.words+' words'+(fp.words<150?' — short, noisy':'')+')' }] },
    { t:'div', a:{style:bw.s({overflowX:'auto'})}, c:{ t:'table', a:{class:'bw_table', style:bw.s({width:'100%'})}, c:[
      { t:'thead', c:{ t:'tr', c:['voice · register','match (vs corpus self-score)','delta (raw)','ngram','rhythm','punct']
          .map(function(h){return {t:'th', c:h};}) } },
      { t:'tbody', c: rows.map(function(row){
          var p = row.r.parts;
          return { t:'tr', c:[
            { t:'td', c: row.label },
            { t:'td', c: bar(row.r.rel) },
            { t:'td', c: p.delta.toFixed(2)+' ('+row.r.delta.toFixed(2)+')' },
            { t:'td', c: p.ngram.toFixed(2) },
            { t:'td', c: p.rhythm.toFixed(2) },
            { t:'td', c: p.punct.toFixed(2) } ]};
        }) }
    ]}}
  ]});
}

bw.mount('#app', sitePage('demo.html', [
  { t:'h1', c:'Voice-match demo' },
  { t:'p', c:'Paste text and score it against the example voices — Mark Twain (fiction, essay) and Charles Darwin (memoir, science), built from public-domain corpora — using the same stylometrics revoice runs locally: Burrows’ Delta on function words, character n-grams, sentence rhythm, punctuation habits. Everything runs in your browser; nothing is uploaded anywhere.' },
  { t:'div', a:{class:'bw_card'}, c:[
    { t:'p', c: Object.keys(SAMPLES).map(function(name){
        return { t:'button', a:{class:'bw_btn rv_chip',
          onclick:function(){ bw.el('#txt').value = SAMPLES[name]; analyze(); } }, c:'sample: '+name };
      }) },
    { t:'textarea', a:{id:'txt', rows:'8', style:bw.s({width:'100%', font:'inherit', padding:'0.6em'}),
      placeholder:'Paste at least a paragraph — 150+ words gives stable scores…'} },
    { t:'p', c:{ t:'button', a:{class:'bw_btn bw_primary', onclick:analyze}, c:'score it' } }
  ]},
  { t:'div', a:{id:'results'} },
  { t:'p', a:{style:bw.s({opacity:'0.75', fontSize:'0.9em'})},
    c:'Scores are relative: compare candidates against each other and against each voice’s own corpus self-band (100 ≈ indistinguishable from the corpus). Short texts are noisy — revoice proper reports full calibration bands, and this demo is a subset of its metrics.' }
]));

fetch('demo/voices.json').then(function(r){ return r.json(); })
  .then(function(v){ VOICES = v; })
  .catch(function(){ bw.el('#results', {t:'p', c:'could not load demo/voices.json — serve this page over http'}); });
</script>
</body>
</html>
