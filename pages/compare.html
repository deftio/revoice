<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>revoice — compare two texts</title>
<meta name="description" content="Paste your original and an edited version and measure how far the register drifted, component by component — n-grams, Burrows' Delta, rhythm, punctuation. Runs entirely in your browser.">
<script src="https://cdn.jsdelivr.net/npm/bitwrench/dist/bitwrench.umd.min.js"></script>
<script src="version.js"></script>
<script src="site.js"></script>
<script src="stylometry.js"></script>
<script src="voicespace.js"></script>
</head>
<body>
<div id="app"></div>
<script>
/* Compare two texts.
 *
 * This page used to answer "is this the same author?" with confident bands
 * ("statistically indistinguishable"). It cannot. Measured by `revoice bench`
 * under a topic-controlled protocol the browser metric scores macro AUC 0.687 /
 * EER 0.367, and on the bundled corpora it rates Darwin's Autobiography as no
 * drift from Twain's A Dog's Tale (+2.5 sigma) while rating Twain's own comic
 * diary as clear drift (-5.4 sigma) -- because the surface features it reads
 * track REGISTER far more than authorship. So the page now answers the question
 * it can actually answer -- how far did the register move, and in which
 * components -- and states the failure mode on the page rather than in a
 * footnote.
 *
 * Presentation note: the score is reported as a z-score against the reference's
 * own leave-one-out variation band, not as a percentage of it. A ratio of two
 * numbers that both sit near 55 saturates and amplifies noise; "how many standard
 * deviations outside the reference's own spread" does not, and it has a meaning.
 */

var state = { result: null };

function bandFor(z) {
  if (z >= -1) return ['success', 'no measurable drift',
    'The candidate sits no further from the reference than the reference’s own passages sit from each other. The surface register did not move. This does NOT mean the same person wrote it — see the warning above.'];
  if (z >= -3) return ['warning', 'some drift',
    'A detectable shift, but within the range where this measure is unreliable. Read the component table rather than the headline number.'];
  return ['danger', 'clear drift',
    'The candidate is measurably further from the reference than the reference’s own passages are. The component table shows where it came from.'];
}

function componentRows(parts, delta) {
  return [
    { name: 'function words (Burrows’ Δ)', v: parts.delta,
      what: 'unconscious grammar-word habits — the classic authorship signal (raw Δ ' + delta.toFixed(2) + ')' },
    { name: 'character n-grams', v: parts.ngram,
      what: 'sub-word texture: spelling, morphology, spacing habits' },
    { name: 'sentence rhythm', v: parts.rhythm,
      what: 'the distribution of sentence lengths' },
    { name: 'punctuation', v: parts.punct,
      what: 'per-sentence punctuation habits' }
  ];
}

function resultView(d) {
  if (!d) {
    return bw.makeAlert({ variant: 'light',
      content: 'Paste a reference and a candidate, then press “compare”.' });
  }
  if (d.error) return bw.makeAlert({ variant: 'warning', content: d.error });

  var b = bandFor(d.z);
  var weakest = d.rows.slice().sort(function (x, y) { return x.v - y.v; })[0];

  return { t: 'div', c: [
    { t: 'div', a: { class: 'rv_cards' }, c: [
      bw.makeStatCard({ value: (d.z >= 0 ? '+' : '') + d.z.toFixed(1), suffix: ' σ',
                        label: 'register distance from the reference’s own spread', variant: b[0] }),
      d.sim ? bw.makeStatCard({
        value: d.sim.overall.toFixed(0),
        label: d.sim.interval_reliable
          ? 'axis similarity (' + d.sim.low.toFixed(0) + '–' + d.sim.high.toFixed(0) + ' at 90%)'
          : 'axis similarity (no interval — too short)',
        variant: '' })
        : bw.makeStatCard({ value: d.composite.toFixed(0), label: 'raw similarity score',
                            variant: '' }),
      bw.makeStatCard({ value: d.self[0].toFixed(0) + ' ± ' + d.self[1].toFixed(0),
                        label: 'reference self-band (' + d.windows + ' windows, leave-one-out)',
                        variant: '' })
    ]},

    bw.makeAlert({ variant: b[0], content: { t: 'span', c: [
      { t: 'b', c: b[1] + '. ' }, b[2] ]}}),

    bw.makeAlert({ variant: 'info', content: { t: 'span', c: [
      { t: 'b', c: 'Biggest movement: ' }, weakest.name,
      ' (similarity ' + weakest.v.toFixed(2) + ') — ', weakest.what, '.' ]}}),

    d.chart ? { t: 'div', a: { class: 'rv_scroll rv_chart' }, c: bw.raw(d.chart) }
            : bw.makeAlert({ variant: 'warning', content:
                'Axis chart unavailable — demo/population.json did not load, so there is no '
                + 'reference population to place this text against.' }),

    d.caveats.length ? bw.makeAlert({ variant: 'warning', content: { t: 'span', c: [
      { t: 'b', c: 'About this run: ' }, d.caveats.join(' · ') ]}}) : ''
  ]};
}

function compare(panel) {
  var ref = (bw.el('#ref') || {}).value || '';
  var cand = (bw.el('#cand') || {}).value || '';
  if (ref.trim().length < 200 || cand.trim().length < 100) {
    state.result = { error: 'Need more text — a few paragraphs of reference and at least one of candidate.' };
    return bw.refresh(panel);
  }
  var base = buildBaseline(ref);
  var r = score(fingerprint(cand), base);

  // the axis chart: reference windows become a voice REGION, and the candidate is
  // placed in it. z-scored against a shipped population of real prose, not against
  // the reference itself — otherwise every coordinate collapses toward zero.
  var chart = '', simReport = null;
  if (POPULATION) {
    var refWindows = vsWindows(ref);
    if (refWindows.length < 2) refWindows = [ref];
    var region = vsFitRegion('your reference', refWindows, POPULATION);
    simReport = vsSimilarityReport(cand, region, POPULATION);
    chart = vsRenderChart(simReport, 'Candidate vs your reference',
      simReport.words + ' words · ' + simReport.windows + ' window(s) · 17 axes · '
      + Math.round(simReport.confidence * 100) + '% bootstrap interval');
  }
  var rw = ((ref.toLowerCase().match(/[a-z']+/g)) || []).length;
  var cw = ((cand.toLowerCase().match(/[a-z']+/g)) || []).length;

  var caveats = [];
  if (rw < 500) caveats.push('the reference is short (' + rw + ' words) — the baseline is coarse; 500+ works much better');
  if (cw < 150) caveats.push('the candidate is short (' + cw + ' words) — scores are noisy below ~150');
  if (base.windows < 3) caveats.push('the reference yielded only ' + base.windows + ' window(s), so the variation band is close to a guess');
  if (base.contaminated) caveats.push('too few windows to hold one out, so the self-band is optimistic');

  if (simReport && !simReport.interval_reliable)
    caveats.push('the candidate is under three paragraphs, so the chart shows no interval');

  state.result = { z: r.z, composite: r.composite, self: base.self, windows: base.windows,
                   rows: componentRows(r.parts, r.delta), caveats: caveats,
                   chart: chart, sim: simReport };
  bw.refresh(panel);
}

bw.mount('#app', sitePage('compare.html', [
  { t: 'h1', c: 'Compare two texts' },
  { t: 'p', c: 'You wrote something; someone — or something — edited it. Paste your original as the reference and the edited version as the candidate, and this page measures how far the style moved, component by component. Everything runs in your browser; nothing is uploaded.' },

  bw.makeAlert({ variant: 'warning', content: { t: 'span', c: [
    { t: 'b', c: 'What this measures — and what it does not. ' },
    'This is a ', { t: 'b', c: 'register-drift detector' }, ', not an authorship test. It reads surface habits: sub-word texture, function-word rates, sentence rhythm, punctuation. Those track ',
    { t: 'b', c: 'how a passage is pitched' }, ' far more than ', { t: 'b', c: 'who wrote it' },
    '. Concretely, on our own example corpora: with Twain’s ', { t: 'i', c: 'A Dog’s Tale' },
    ' as the reference, Darwin’s first-person ', { t: 'i', c: 'Autobiography' },
    ' reads as no drift at all (+2.5σ) while Twain’s own comic diary reads as clear drift (−5.4σ) — because the first pair share a register and the second pair do not. Under a topic-controlled protocol the measure scores AUC 0.69 and an equal error rate of 0.37. Use it to check whether an edit moved your register; do not use it to decide who wrote something.'
  ]}}),

  section('Paste the two texts', [
    { t: 'div', a: { class: 'rv_split' }, c: [
      { t: 'div', a: { class: 'bw_bccl_card' }, c: { t: 'div', a: { class: 'bw_bccl_card_body' }, c:
        bw.makeFormGroup({
          label: 'Reference — the voice to match',
          help: 'Your original. 500+ words, ideally several paragraphs on more than one topic.',
          input: bw.makeTextarea({ id: 'ref', rows: 12,
            placeholder: 'A few paragraphs of the writing you want to preserve…' })
        }) }},
      { t: 'div', a: { class: 'bw_bccl_card' }, c: { t: 'div', a: { class: 'bw_bccl_card_body' }, c:
        bw.makeFormGroup({
          label: 'Candidate — did the style survive?',
          help: 'The edited version. 150+ words for a stable reading.',
          input: bw.makeTextarea({ id: 'cand', rows: 12,
            placeholder: 'The text to test…' })
        }) }}
    ]},
    { t: 'div', a: { id: 'go' }, c: '' },
    { t: 'div', a: { id: 'results' }, c: '' }
  ]),

  section('Where the interval comes from', [
    { t: 'p', c: 'The candidate is split into paragraph windows and those windows are resampled with replacement 400 times. The band is the 5th to 95th percentile of the result — it answers how much this reading would move if you had been handed a different few pages of the same document. Under three windows there is nothing to resample, and the page says so instead of drawing a band it cannot support.' },
    bw.makeAlert({ variant: 'info', content: { t: 'span', c: [
      { t: 'b', c: 'Same numbers as the local tool. ' },
      'This page runs a JavaScript port of the same 17-axis measurement revoice uses; a test in the repo asserts the two agree exactly on shared fixtures, so what you see here is what ',
      { t: 'code', c: 'revoice space' }, ' would print.' ]}})
  ]),

  section('How to read the result', [
    { t: 'p', c: 'The reference is split into windows and each is scored against a baseline built from the others — leave-one-out, so no window is graded against itself. That gives a self-band: how much the reference varies against its own writing. The candidate is then placed relative to that band.' },
    cardRow([
      { title: '≥ −1σ · no measurable drift', content: 'The candidate is no further from the reference than the reference’s own paragraphs are from each other.' },
      { title: '−1σ to −3σ · some drift', content: 'Something moved, but the measure is unreliable at that distance. Look at which component dropped.' },
      { title: '< −3σ · clear drift', content: 'A real, measurable change in surface style. The component table shows where it came from.' }
    ]),
    bw.makeAlert({ variant: 'info', content: { t: 'span', c: [
      { t: 'b', c: 'Two failure modes worth knowing. ' },
      'First, topic: if reference and candidate are about the same subject the score inflates, and if they are on different subjects it deflates — so give the reference material on more than one topic. Second, register: a different author writing in the same register will look like no drift at all. Both are consequences of measuring surface form, and both are why the local tool adds corpus calibration and register attribution on top of this.'
    ]}})
  ]),

  section('What the local tool adds', [
    { t: 'p', c: ['This page runs a four-component subset in JavaScript against a reference you paste. The installed tool builds a real corpus baseline, adds vocabulary similarity, register attribution and content-blend analysis, and ships ',
      { t: 'code', c: 'revoice bench' }, ' — the harness that produced the reliability numbers quoted above. Evidence and the plan to improve them: ',
      { t: 'a', a: { href: 'https://github.com/deftio/revoice/blob/main/docs/metrics.md' }, c: 'docs/metrics.md' },
      '. Setup: ', { t: 'a', a: { href: 'getting-started.html' }, c: 'getting started' }, '.'] }
  ])
]));

/* The reference population: 17 axes x (mean, sd) fitted on the benchmark corpus.
   ~1 KB, so it costs nothing to ship and it is what makes a coordinate mean
   "compared to real English prose" rather than "compared to itself". */
var POPULATION = null;
fetch('demo/population.json').then(function (r) { return r.json(); })
  .then(function (p) { POPULATION = p; })
  .catch(function () { /* the page still works; the chart says why it is missing */ });

var panel = bw.mount('#results', { t: 'div', o: {
  state: state,
  render: function (el) { bw.DOM(el, resultView(state.result)); }
}});

bw.DOM('#go', bw.makeButton({ text: 'compare', variant: 'primary',
                              onclick: function () { compare(panel); } }));
</script>
</body>
</html>
