<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>revoice — rewrite documents in your own voice</title>
<script src="https://cdn.jsdelivr.net/npm/bitwrench/dist/bitwrench.umd.min.js"></script>
</head>
<body>
<div id="app"></div>
<script>
bw.loadStyles({ primary: '#4a6fa5', secondary: '#3d8b52' });

function code(s){ return { t:'pre', a:{class:'bw_card', style: bw.s({overflowX:'auto', fontSize:'0.88em'})}, c:{t:'code', c:s} }; }
function section(title, kids){ return { t:'section', c:[{t:'h2', c:title}].concat(kids) }; }

var page = { t:'div', a:{class:'bw_container', style: bw.s({maxWidth:'880px'})}, c:[

  { t:'header', a:{ style: bw.s({padding:'2.2em 0 0.6em 0'}) }, c:[
    { t:'h1', a:{style: bw.s({marginBottom:'0.1em'})}, c:'revoice' },
    { t:'p', a:{style: bw.s({fontSize:'1.15em'})},
      c:'Rewrite documents in your own voice — structure preserved, meaning preserved.' },
    { t:'p', c:[
      { t:'a', a:{href:'https://github.com/deftio/revoice'}, c:{t:'img', a:{src:'https://img.shields.io/badge/License-BSD%202--Clause-blue.svg', alt:'License'}} },
      ' ',
      { t:'a', a:{href:'https://github.com/deftio/revoice/actions/workflows/ci.yml'}, c:{t:'img', a:{src:'https://github.com/deftio/revoice/actions/workflows/ci.yml/badge.svg', alt:'CI'}} }
    ]},
    { t:'p', c:[
      { t:'a', a:{class:'bw_btn bw_primary', href:'demo.html'}, c:'Try the voice-match demo' }, ' ',
      { t:'a', a:{class:'bw_btn', href:'https://github.com/deftio/revoice'}, c:'GitHub' }, ' ',
      { t:'a', a:{class:'bw_btn', href:'architecture.md'}, c:'Architecture' }
    ]}
  ]},

  section('What it does', [
    { t:'p', c:'Feed revoice your writing. It learns your registers (professional, casual, fiction, …), then rewrites any document — brain dumps, AI-assisted drafts, mixed-source patchworks — so it reads as one author: you. Text already in your target voice passes through byte-identical. LLMs "AI-ify" prose; revoice is the antidote — a register-transfer engine within one author.' },
    { t:'p', c:'Local-first: runs entirely on your machine with Ollama or any OpenAI-compatible server. Cloud providers optional. Private by construction — your corpus never leaves your disk.' }
  ]),

  section('Quick start', [
    code('git clone https://github.com/deftio/revoice && cd revoice\nuv sync --all-extras\n\n# try the bundled Mark Twain example voice (public domain)\ncp revoice.example.yaml revoice.yaml   # defaults to local Ollama\nmkdir -p data && cp -r examples/voices/twain data/twain\n\nuv run revoice learn twain\nuv run revoice run draft.md -o out.md --voice twain --register fiction -s 1.0\nuv run revoice stats draft.md --voice twain    # objective voice match\nuv run revoice serve --gui                     # API + review GUI')
  ]),

  section('How it works', [
    code('input ── parse ── plan (deterministic) ── attribute ── rewrite ── validate\n      ── lint ── critique (rubrics) ── reassemble ── output + reviewable diff'),
    { t:'div', a:{class:'bw_row'}, c:[
      { t:'div', a:{class:'bw_col'}, c: bw.makeCard({ title:'Structure is inviolable',
        content:'The LLM only sees text spans with IDs — never document structure. Code, tables, links, math, and citations survive by construction.' }) },
      { t:'div', a:{class:'bw_col'}, c: bw.makeCard({ title:'Minimal-touch principle',
        content:'Every span is attributed against the target register with stylometrics (Burrows’ Delta, n-grams, rhythm). Text that is already you is not rewritten.' }) }
    ]},
    { t:'div', a:{class:'bw_row'}, c:[
      { t:'div', a:{class:'bw_col'}, c: bw.makeCard({ title:'No fake numbers',
        content:'Quality is judged by anchored categorical rubrics — the model classifies, the code computes. Vote distributions get real agreement descriptors, never an LLM-asserted 0.85.' }) },
      { t:'div', a:{class:'bw_col'}, c: bw.makeCard({ title:'The flywheel',
        content:'Reviewing rewrites (accept / reject / edit per span) writes training pairs — the dataset for fine-tuning a local model that IS your voice.' }) }
    ]}
  ]),

  section('Objective voice match', [
    { t:'p', c:['revoice measures rather than vibes: Burrows’ Delta on function words, character and word n-gram profiles, sentence-rhythm histograms, punctuation habits — calibrated against your corpus’s own self-scores. ',
      { t:'a', a:{href:'demo.html'}, c:'See it live in the demo' },
      ' — paste any text and watch it scored against Twain and Darwin, in your browser, no server.' ]}
  ]),

  section('Links', [
    { t:'ul', c:[
      { t:'li', c:{ t:'a', a:{href:'https://github.com/deftio/revoice'}, c:'Source (github.com/deftio/revoice)' } },
      { t:'li', c:{ t:'a', a:{href:'architecture.md'}, c:'Architecture & roadmap' } },
      { t:'li', c:{ t:'a', a:{href:'https://github.com/deftio/revoice/tree/main/revoice/rubric'}, c:'rubric — anchored categorical judging (standalone module)' } },
      { t:'li', c:{ t:'a', a:{href:'https://github.com/deftio/bitwrench'}, c:'Built with bitwrench' } }
    ]}
  ]),

  { t:'footer', a:{ style: bw.s({padding:'2em 0', opacity:'0.7', fontSize:'0.9em'}) },
    c:'BSD-2-Clause © M. A. Chatterjee / deftio' }
]};

bw.mount('#app', page);
</script>
</body>
</html>
